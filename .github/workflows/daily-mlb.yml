name: Daily MLB Starter Preview

on:
  schedule:
    # 12:00 UTC ≈ 8:00 AM ET. Probable starters for the day are usually posted
    # by early morning. GitHub cron is UTC and can be delayed a few minutes.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button so you can test on demand

permissions:
  contents: write         # lets the job commit the updated log CSV back

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build today's starter board
        run: python mlb_pitcher_core.py | tee daily_report.txt

      - name: Commit page + log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html mlb_previews.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "MLB starters $(date -u +%F)" && git push)

      - name: Email the preview
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Today's probable MLB starters"
          to: ${{ secrets.MAIL_TO }}
          from: MLB Bot <${{ secrets.MAIL_USERNAME }}>
          body: file://daily_report.txt
          attachments: mlb_previews.csv
